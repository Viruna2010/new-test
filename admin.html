<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIRU Radio - Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
    }
    .panel-box {
      width: 100%;
      max-width: 680px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #1e293b;
      padding-bottom: 18px;
      margin-bottom: 22px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 1px;
    }
    .badge {
      background: #e11d48;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .input-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 10px 14px;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .btn {
      padding: 11px 20px;
      font-weight: 700;
      font-size: 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-primary { background: #0284c7; color: #fff; width: 100%; margin-top: 8px; }
    .btn-primary:hover { background: #0369a1; }
    .btn-save { background: #16a34a; color: #fff; width: 100%; font-size: 15px; margin-top: 25px; padding: 14px; }
    .btn-save:hover { background: #15803d; }
    .btn-delete { background: #dc2626; color: #fff; padding: 6px 12px; font-size: 12px; }
    .btn-up, .btn-down { background: #334155; color: #fff; padding: 6px 10px; font-size: 12px; }
    
    /* Song List items */
    .song-list {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .song-item {
      display: flex;
      align-items: center;
      background: #1e293b;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      gap: 12px;
    }
    .song-thumb {
      width: 65px;
      height: 42px;
      border-radius: 6px;
      object-fit: cover;
    }
    .song-details {
      flex: 1;
      overflow: hidden;
    }
    .song-title {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-artist {
      font-size: 12px;
      color: #94a3b8;
    }
    .actions {
      display: flex;
      gap: 6px;
    }
    #status-msg {
      margin-top: 15px;
      font-size: 13.5px;
      font-weight: 600;
      text-align: center;
    }
    /* Password Modal */
    #pw-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .modal-box {
      background: #0f172a;
      padding: 30px;
      border-radius: 14px;
      border: 1px solid #334155;
      width: 320px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Password Login Modal -->
  <div id="pw-modal">
    <div class="modal-box">
      <h2 style="font-size: 18px; margin-bottom: 12px; color:#38bdf8;">Admin Login</h2>
      <input type="password" id="pw-input" placeholder="Password ඇතුළත් කරන්න..." style="margin-bottom: 14px;">
      <button class="btn btn-primary" onclick="login()">Login</button>
      <div id="login-err" style="color:#ef4444; font-size:12px; margin-top:8px;"></div>
    </div>
  </div>

  <div class="panel-box">
    <div class="header">
      <h1>VIRU RADIO • ADMIN</h1>
      <span class="badge">PLAYLIST MANAGER</span>
    </div>

    <!-- Add Song Form -->
    <div class="input-group">
      <label>YouTube Video Link or ID:</label>
      <input type="text" id="yt-input" placeholder="e.g. https://youtu.be/egoeUY0PocE or egoeUY0PocE">
    </div>

    <div style="display: flex; gap: 10px;">
      <div class="input-group" style="flex: 1;">
        <label>Song Title:</label>
        <input type="text" id="title-input" placeholder="e.g. Meedumen Wasi">
      </div>
      <div class="input-group" style="flex: 1;">
        <label>Artist:</label>
        <input type="text" id="artist-input" placeholder="e.g. VIRU Beatz">
      </div>
    </div>

    <button class="btn btn-primary" onclick="addSong()">+ Add Song to Playlist</button>

    <!-- Playlist Queue -->
    <h3 style="font-size: 15px; margin-top: 25px; color:#94a3b8;">Current Live Queue (<span id="count">0</span> Songs):</h3>
    <div class="song-list" id="song-list">
      <div style="color: #64748b; font-size: 13px; text-align: center; padding: 20px;">Loading songs...</div>
    </div>

    <button class="btn btn-save" onclick="saveToGitHub()">💾 Save & Push to GitHub</button>
    <div id="status-msg"></div>
  </div>

  <script>
    let playlist = [];
    let adminPassword = '';

    function login() {
      const val = document.getElementById('pw-input').value.trim();
      if (!val) return;
      adminPassword = val;
      document.getElementById('pw-modal').style.display = 'none';
      loadPlaylist();
    }

    // Helper: Extract YouTube ID from link or raw ID
    function extractYouTubeID(url) {
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? match : url.trim();
    }

    // 1. Load Playlist from Backend
    async function loadPlaylist() {
      try {
        const res = await fetch('/api/playlist');
        const data = await res.json();
        if (data.playlist) {
          playlist = data.playlist;
          renderList();
        }
      } catch (err) {
        document.getElementById('status-msg').innerText = "Load Error: " + err.message;
      }
    }

    // 2. Render Songs
    function renderList() {
      const listEl = document.getElementById('song-list');
      document.getElementById('count').innerText = playlist.length;

      if (playlist.length === 0) {
        listEl.innerHTML = '<div style="color: #64748b; font-size: 13px; text-align: center; padding: 20px;">No songs in playlist!</div>';
        return;
      }

      listEl.innerHTML = '';
      playlist.forEach((s, idx) => {
        const item = document.createElement('div');
        item.className = 'song-item';
        item.innerHTML = `
          <img class="song-thumb" src="https://img.youtube.com/vi/${s.id}/mqdefault.jpg" alt="thumb">
          <div class="song-details">
            <div class="song-title">${idx + 1}. ${s.title}</div>
            <div class="song-artist">${s.artist}</div>
          </div>
          <div class="actions">
            ${idx > 0 ? `<button class="btn btn-up" onclick="moveSong(${idx}, -1)">▲</button>` : ''}
            ${idx < playlist.length - 1 ? `<button class="btn btn-down" onclick="moveSong(${idx}, 1)">▼</button>` : ''}
            <button class="btn btn-delete" onclick="deleteSong(${idx})">✕</button>
          </div>
        `;
        listEl.appendChild(item);
      });
    }

    // 3. Add Song
    function addSong() {
      const rawUrl = document.getElementById('yt-input').value;
      const title = document.getElementById('title-input').value.trim() || 'Untitled Song';
      const artist = document.getElementById('artist-input').value.trim() || 'VIRU Radio';

      const id = extractYouTubeID(rawUrl);
      if (!id || id.length !== 11) {
        alert('කරුණාකර නිවැරදි YouTube Link එකක් හෝ Video ID එකක් ඇතුළත් කරන්න!');
        return;
      }

      playlist.push({ id, title, artist });
      renderList();

      document.getElementById('yt-input').value = '';
      document.getElementById('title-input').value = '';
      document.getElementById('artist-input').value = '';
    }

    function deleteSong(idx) {
      playlist.splice(idx, 1);
      renderList();
    }

    function moveSong(idx, dir) {
      const temp = playlist[idx];
      playlist[idx] = playlist[idx + dir];
      playlist[idx + dir] = temp;
      renderList();
    }

    // 4. Save to GitHub via Vercel Backend
    async function saveToGitHub() {
      const status = document.getElementById('status-msg');
      status.style.color = '#38bdf8';
      status.innerText = 'GitHub එකට commit වෙමින් පවතී... කරුණාකර රැඳී සිටින්න.';

      try {
        const res = await fetch('/api/playlist', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-password': adminPassword
          },
          body: JSON.stringify({ playlist })
        });

        const data = await res.json();
        if (res.ok) {
          status.style.color = '#22c55e';
          status.innerText = '✓ ' + data.message;
        } else {
          status.style.color = '#ef4444';
          status.innerText = '✕ Error: ' + (data.error || 'Failed to save');
        }
      } catch (err) {
        status.style.color = '#ef4444';
        status.innerText = 'Network Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
