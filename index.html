<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIRU Radio - Live TV Broadcast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Montserrat:wght@700;800;900&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 1. Full-Screen Video (Balanced 16:9 Fit, Zero black bars) */
    .video-viewport {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 100vh;
      transform: translate(-50%, -50%);
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    #yt-player {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw;
      min-height: 100vh;
      min-width: 177.78vh;
      transform: translate(-50%, -50%) scale(1.08);
      border: none;
    }

    /* 2. Top Right: Real TV Broadcast Bug */
    .tv-channel-bug {
      position: absolute;
      top: 25px;
      right: 35px;
      z-index: 20;
      display: flex;
      align-items: center;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.88) 0%, rgba(30, 41, 59, 0.8) 100%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
    }

    .brand-section {
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Montserrat', sans-serif;
    }

    .brand-viru {
      font-weight: 900;
      font-size: 21px;
      letter-spacing: 2px;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }

    .brand-radio {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 1px;
      color: #ffffff;
    }

    .live-section {
      background: #e11d48;
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 900;
      letter-spacing: 1.5px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffffff;
      animation: liveGlow 1s infinite alternate ease-in-out;
    }

    @keyframes liveGlow {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.35; transform: scale(0.8); }
    }

    /* 3. Bottom Right: Plain White TV Clock */
    .tv-clock {
      position: absolute;
      bottom: 44px;
      right: 25px;
      z-index: 20;
      font-family: 'Orbitron', monospace;
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1.5px;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.95), 0 0 15px rgba(0, 0, 0, 0.9);
    }

    /* 4. Bottom Broadcast Bar */
    .ticker-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 36px;
      background: rgba(8, 12, 22, 0.95);
      z-index: 20;
      display: flex;
      align-items: center;
      border-top: 2px solid #e11d48;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.9);
    }

    .on-air-badge {
      background: #e11d48;
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 900;
      padding: 0 18px;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 1.5px;
      flex-shrink: 0;
      z-index: 2;
    }

    .ticker-viewport {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }

    .ticker-content {
      display: inline-block;
      padding-left: 100%;
      animation: tickerScroll 36s linear infinite;
      font-size: 12.5px;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: 0.8px;
    }

    @keyframes tickerScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    .ticker-item { display: inline-block; margin-right: 45px; }
    .highlight-red { color: #fb7185; font-weight: 700; }
    .highlight-blue { color: #38bdf8; font-weight: 700; }
    .highlight-brand { color: #c084fc; font-weight: 800; }

    /* =========================================================
       SECRET ADMIN DRAWER (Press 'A')
       ========================================================= */
    #admin-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .admin-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      width: 90%;
      max-width: 580px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      user-select: auto;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 18px;
    }

    .admin-header h2 { font-size: 18px; color: #38bdf8; }
    .close-btn { background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; font-weight: bold; }
    .close-btn:hover { color: #fff; }

    .control-box {
      background: #1e293b;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      margin-bottom: 18px;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; font-weight: 600; }
    .form-group input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 13.5px;
      font-family: inherit;
    }
    .form-group input:focus { outline: none; border-color: #38bdf8; }

    .btn-action {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 9px 16px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      font-size: 13.5px;
      margin-top: 4px;
    }
    .btn-action:hover { background: #0369a1; }

    .btn-save-fb {
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      font-size: 14px;
      margin-top: 18px;
    }
    .btn-save-fb:hover { background: #15803d; }

    .queue-list { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
    .queue-item {
      background: #1e293b;
      padding: 8px 12px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #334155;
      gap: 10px;
    }
    .queue-text { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .btn-del { background: #dc2626; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }

    /* Password Dialog */
    #pw-dialog {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .pw-card {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 25px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
    }
  </style>
</head>
<body onclick="unmuteFallback()">

  <!-- 1. Video Stage -->
  <div class="video-viewport">
    <div id="yt-player"></div>
  </div>

  <!-- 2. TV Logo Bug -->
  <div class="tv-channel-bug">
    <div class="brand-section">
      <span class="brand-viru">VIRU</span>
      <span class="brand-radio">RADIO</span>
    </div>
    <div class="live-section">
      <span class="live-dot"></span>
      LIVE
    </div>
  </div>

  <!-- 3. TV Clock -->
  <div class="tv-clock" id="clock">00:00:00 PM</div>

  <!-- 4. Bottom Broadcast Bar -->
  <div class="ticker-container">
    <div class="on-air-badge">
      <span class="live-dot"></span>
      ON AIR
    </div>
    <div class="ticker-viewport">
      <div class="ticker-content">
        <span class="ticker-item">★ WELCOME TO <span class="highlight-blue">VIRU RADIO LIVE</span> 24/7 BROADCAST</span>
        <span class="ticker-item">★ NOW PLAYING: <span class="highlight-brand" id="now-playing-title">VIRU BEATZ</span></span>
        <span class="ticker-item">★ <span class="highlight-red">STAY WITH US</span> — 24/7 LIVE STREAMING</span>
        <span class="ticker-item">★ <span class="highlight-brand">POWERED BY VIRU BEATZ</span> — ALL RIGHTS RESERVED</span>
      </div>
    </div>
  </div>

  <!-- PASSWORD DIALOG (Triggered by 'A' Key) -->
  <div id="pw-dialog">
    <div class="pw-card">
      <h3 style="font-size: 16px; margin-bottom: 10px; color: #38bdf8;">Admin Access</h3>
      <p style="font-size: 12px; color: #94a3b8; margin-bottom: 12px;">Password එක ගසා Enter ඔබන්න:</p>
      <input type="password" id="admin-pass-input" placeholder="Password..." style="width: 100%; padding: 8px 12px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 6px; margin-bottom: 12px;">
      <div style="display: flex; gap: 8px;">
        <button class="btn-action" onclick="verifyPassword()">Unlock</button>
        <button class="btn-action" style="background:#475569;" onclick="closePasswordDialog()">Cancel</button>
      </div>
      <div id="pw-err" style="color:#ef4444; font-size:11px; margin-top:8px;"></div>
    </div>
  </div>

  <!-- ADMIN DRAWER -->
  <div id="admin-overlay">
    <div class="admin-card">
      <div class="admin-header">
        <h2>🔥 VIRU RADIO • ADMIN PANEL</h2>
        <button class="close-btn" onclick="closeAdmin()">✕</button>
      </div>

      <!-- LIVE PLAYBACK CONTROLS -->
      <div class="control-box">
        <div style="font-size: 11px; font-weight: 800; color: #38bdf8; letter-spacing: 1px; margin-bottom: 8px;">LIVE BROADCAST CONTROLS</div>
        <div style="display: flex; gap: 8px;">
          <button class="btn-action" id="btn-pause-play" style="background: #eab308; color: #000; font-weight: 800;" onclick="togglePlayPause()">⏸ Pause Video</button>
          <button class="btn-action" style="background: #6366f1; color: #fff; font-weight: 800;" onclick="skipNextSong()">⏭ Next Song</button>
        </div>
      </div>

      <div class="form-group">
        <label>YouTube Video Link or ID:</label>
        <input type="text" id="add-yt" placeholder="Paste YouTube link here...">
      </div>
      <div style="display: flex; gap: 8px;">
        <div class="form-group" style="flex:1;">
          <label>Song Title:</label>
          <input type="text" id="add-title" placeholder="e.g. Song Name">
        </div>
        <div class="form-group" style="flex:1;">
          <label>Artist:</label>
          <input type="text" id="add-artist" placeholder="e.g. Artist / Channel">
        </div>
      </div>
      <button class="btn-action" onclick="addSong()">+ Add to Queue</button>

      <div style="margin-top: 20px;">
        <label style="font-size: 12px; color: #94a3b8; font-weight: 700;">Active Playlist (<span id="song-count">0</span>):</label>
        <div class="queue-list" id="queue-box"></div>
      </div>

      <button class="btn-save-fb" onclick="saveToFirebase()">🔥 Save to Firebase (Realtime Sync)</button>
      <div id="save-status" style="font-size: 12px; text-align: center; margin-top: 8px;"></div>
    </div>
  </div>

  <script>
    // =========================================================
    // CONFIGURATION
    // =========================================================
    const ADMIN_PASSWORD = "viru";
    const FIREBASE_URL = "https://radio-caf5e-default-rtdb.firebaseio.com/playlist.json";

    // Default Fallback
    let playlist = [
      { id: "egoeUY0PocE", title: "Meedumen Wasi", artist: "VIRU Beatz" }
    ];
    let currentIndex = 0;
    let player = null;

    // 1. Clock (Asia/Colombo SLST)
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', {
        timeZone: 'Asia/Colombo',
        hour12: true,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
    }
    setInterval(updateClock, 250);
    updateClock();

    // 2. Secret 'A' Key Handler
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'a' || e.key === 'A') {
        openPasswordDialog();
      }
    });

    function openPasswordDialog() {
      document.getElementById('pw-dialog').style.display = 'flex';
      document.getElementById('admin-pass-input').value = '';
      document.getElementById('admin-pass-input').focus();
    }

    function closePasswordDialog() {
      document.getElementById('pw-dialog').style.display = 'none';
    }

    function verifyPassword() {
      const input = document.getElementById('admin-pass-input').value;
      if (input === ADMIN_PASSWORD) {
        closePasswordDialog();
        openAdmin();
      } else {
        document.getElementById('pw-err').innerText = 'වැරදි Password එකක්!';
      }
    }

    document.getElementById('admin-pass-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') verifyPassword();
    });

    function openAdmin() {
      document.getElementById('admin-overlay').style.display = 'flex';
      renderQueue();
    }

    function closeAdmin() {
      document.getElementById('admin-overlay').style.display = 'none';
    }

    // 3. Playback Controls (Pause / Resume / Next)
    function togglePlayPause() {
      if (!player || typeof player.getPlayerState !== 'function') return;
      const state = player.getPlayerState();
      const btn = document.getElementById('btn-pause-play');

      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
        btn.innerText = '▶ Resume Video';
        btn.style.background = '#16a34a';
        btn.style.color = '#fff';
      } else {
        player.playVideo();
        btn.innerText = '⏸ Pause Video';
        btn.style.background = '#eab308';
        btn.style.color = '#000';
      }
    }

    function skipNextSong() {
      playNext();
    }

    // 4. Firebase REST API Engine
    async function loadFromFirebase() {
      try {
        const res = await fetch(FIREBASE_URL);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            playlist = data;
          }
        }
      } catch (err) {
        console.log("Firebase sync fallback");
      }
    }

    async function saveToFirebase() {
      const status = document.getElementById('save-status');
      status.style.color = '#38bdf8';
      status.innerText = 'Firebase වෙත Save වෙමින් පවතී...';

      try {
        const res = await fetch(FIREBASE_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(playlist)
        });
        if (res.ok) {
          status.style.color = '#22c55e';
          status.innerText = '✓ Firebase එකේ සදහටම Save වුණා!';
          setTimeout(() => { status.innerText = ''; }, 3000);
        } else {
          status.style.color = '#ef4444';
          status.innerText = 'Save Failed!';
        }
      } catch (e) {
        status.style.color = '#ef4444';
        status.innerText = 'Network Error: ' + e.message;
      }
    }

    // 5. Bulletproof YouTube ID Extractor (Zero-regex split parser)
    function extractID(url) {
      if (!url) return '';
      url = url.trim();

      // Handles youtu.be/xxxx links
      if (url.includes('youtu.be/')) {
        return url.split('youtu.be/').split('?')[0].split('&')[0].substring(0, 11);
      }
      // Handles youtube.com/watch?v=xxxx links
      if (url.includes('v=')) {
        return url.split('v=').split('&')[0].substring(0, 11);
      }
      // Handles embed/, shorts/, live/
      if (url.includes('embed/')) {
        return url.split('embed/').split('?')[0].substring(0, 11);
      }
      if (url.includes('shorts/')) {
        return url.split('shorts/').split('?')[0].substring(0, 11);
      }
      if (url.includes('live/')) {
        return url.split('live/').split('?')[0].substring(0, 11);
      }
      // If already a raw 11-char ID
      return url.substring(0, 11);
    }

    function addSong() {
      const url = document.getElementById('add-yt').value;
      const title = document.getElementById('add-title').value.trim() || 'New Track';
      const artist = document.getElementById('add-artist').value.trim() || 'VIRU Radio';

      const id = extractID(url);
      if (!id || id.length !== 11) {
        alert('කරුණාකර නිවැරදි YouTube Link එකක් ලබාදෙන්න!');
        return;
      }

      playlist.push({ id, title, artist });
      renderQueue();

      document.getElementById('add-yt').value = '';
      document.getElementById('add-title').value = '';
      document.getElementById('add-artist').value = '';
    }

    function removeSong(idx) {
      if (playlist.length <= 1) {
        alert('අවම වශයෙන් එක සින්දුවක්වත් තිබිය යුතුය!');
        return;
      }
      playlist.splice(idx, 1);
      renderQueue();
    }

    function renderQueue() {
      const box = document.getElementById('queue-box');
      document.getElementById('song-count').innerText = playlist.length;
      box.innerHTML = '';

      playlist.forEach((s, i) => {
        const row = document.createElement('div');
        row.className = 'queue-item';
        row.innerHTML = `
          <span class="queue-text">${i + 1}. ${s.title} - <small style="color:#94a3b8;">${s.artist}</small></span>
          <button class="btn-del" onclick="removeSong(${i})">✕</button>
        `;
        box.appendChild(row);
      });
    }

    // 6. YouTube Player Engine (Auto-Advance & Loop)
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    window.onYouTubeIframeAPIReady = async function() {
      await loadFromFirebase();
      createPlayer(playlist[0].id);
    };

    function createPlayer(videoId) {
      updateUI();
      player = new YT.Player('yt-player', {
        videoId: videoId,
        playerVars: {
          'autoplay': 1,
          'controls': 0,
          'enablejsapi': 1,
          'modestbranding': 1,
          'rel': 0,
          'playsinline': 1
        },
        events: {
          'onReady': (e) => e.target.playVideo(),
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        playNext();
      }
    }

    async function playNext() {
      await loadFromFirebase();
      currentIndex = (currentIndex + 1) % playlist.length;
      const next = playlist[currentIndex];
      updateUI();

      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById(next.id);
      }
    }

    function updateUI() {
      const cur = playlist[currentIndex];
      if (cur) {
        document.getElementById('now-playing-title').innerText = `${cur.title} • ${cur.artist}`;
      }
    }

    function unmuteFallback() {
      if (player && typeof player.unMute === 'function') {
        player.playVideo();
        player.unMute();
      }
    }
  </script>
</body>
</html>
