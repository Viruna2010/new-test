<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIRU Radio - Live Broadcast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Montserrat:wght@700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: #000;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 1. Perfect 16:9 Full-Screen Video (No black bars & no heavy crop) */
    .video-viewport {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 100vh;
      transform: translate(-50%, -50%);
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .video-viewport iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw;
      min-height: 100vh;
      min-width: 177.78vh;
      /* 1.08 zoom crops black edges & title, but keeps 95% width so sides are NOT cut */
      transform: translate(-50%, -50%) scale(1.08);
      border: none;
    }

    /* 2. Top Right: Real TV Broadcast Watermark Bug */
    .tv-channel-bug {
      position: absolute;
      top: 25px;
      right: 35px;
      z-index: 20;
      display: flex;
      align-items: center;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.88) 0%, rgba(30, 41, 59, 0.8) 100%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(10px);
    }

    .brand-section {
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Montserrat', sans-serif;
    }

    .brand-viru {
      font-weight: 900;
      font-size: 21px;
      letter-spacing: 2px;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }

    .brand-radio {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 1px;
      color: #ffffff;
      opacity: 0.95;
    }

    .live-section {
      background: #e11d48;
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 900;
      letter-spacing: 1.5px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 8px #ffffff;
      animation: liveGlow 1s infinite alternate ease-in-out;
    }

    @keyframes liveGlow {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.35; transform: scale(0.8); }
    }

    /* 3. Bottom Right: Real TV Style White Clock (Bold & Clean, No Box) */
    .tv-clock {
      position: absolute;
      bottom: 44px;
      right: 25px;
      z-index: 20;
      font-family: 'Orbitron', monospace;
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1.5px;
      /* Heavy drop shadow ensures it pops against any background */
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.95), 0 0 15px rgba(0, 0, 0, 0.9);
    }

    /* 4. Bottom Broadcast Bar */
    .ticker-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 36px;
      background: rgba(8, 12, 22, 0.95);
      z-index: 20;
      display: flex;
      align-items: center;
      border-top: 2px solid #e11d48;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.9);
    }

    .on-air-badge {
      background: #e11d48;
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 900;
      padding: 0 18px;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 1.5px;
      flex-shrink: 0;
      box-shadow: 4px 0 15px rgba(225, 29, 72, 0.5);
      z-index: 2;
    }

    .ticker-viewport {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }

    .ticker-content {
      display: inline-block;
      padding-left: 100%;
      animation: tickerScroll 36s linear infinite;
      font-size: 12.5px;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: 0.8px;
    }

    @keyframes tickerScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    .ticker-item {
      display: inline-block;
      margin-right: 45px;
    }

    .highlight-red { color: #fb7185; font-weight: 700; }
    .highlight-blue { color: #38bdf8; font-weight: 700; }
    .highlight-brand { color: #c084fc; font-weight: 800; }
  </style>
</head>
<body onclick="unmuteFallback()">

  <!-- 1. Full-Screen Video (Balanced Fit) -->
  <div class="video-viewport">
    <iframe 
      id="yt-video"
      src="https://www.youtube.com/embed/egoeUY0PocE?autoplay=1&mute=0&loop=1&playlist=egoeUY0PocE&enablejsapi=1&controls=0&modestbranding=1&rel=0&iv_load_policy=3"
      allow="autoplay; encrypted-media">
    </iframe>
  </div>

  <!-- 2. Top Right: Real TV Broadcast Bug -->
  <div class="tv-channel-bug">
    <div class="brand-section">
      <span class="brand-viru">VIRU</span>
      <span class="brand-radio">RADIO</span>
    </div>
    <div class="live-section">
      <span class="live-dot"></span>
      LIVE
    </div>
  </div>

  <!-- 3. Bottom Right: Clear TV Style White Clock -->
  <div class="tv-clock" id="clock">00:00:00 PM</div>

  <!-- 4. Bottom Broadcast Bar -->
  <div class="ticker-container">
    <div class="on-air-badge">
      <span class="live-dot"></span>
      ON AIR
    </div>
    <div class="ticker-viewport">
      <div class="ticker-content">
        <span class="ticker-item">★ WELCOME TO <span class="highlight-blue">VIRU RADIO LIVE</span> 24/7 BROADCAST</span>
        <span class="ticker-item">★ <span class="highlight-red">STAY WITH US</span> — THIS IS CURRENTLY A LIVE TEST STREAM</span>
        <span class="ticker-item">★ STREAMING HIGH FIDELITY NON-STOP MUSIC & VISUALS</span>
        <span class="ticker-item">★ <span class="highlight-brand">POWERED BY VIRU BEATZ</span> — ALL RIGHTS RESERVED</span>
        <span class="ticker-item">★ ENJOY THE RHYTHM & THANK YOU FOR WATCHING!</span>
      </div>
    </div>
  </div>

  <script>
    // Exact Sri Lanka Time (SLST Asia/Colombo)
    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-US', {
        timeZone: 'Asia/Colombo',
        hour12: true,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      document.getElementById('clock').innerText = timeStr;
    }

    setInterval(updateClock, 250);
    updateClock();

    // Fallback unmute
    function unmuteFallback() {
      const iframe = document.getElementById('yt-video');
      if (iframe && iframe.contentWindow) {
        iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
        iframe.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
      }
    }
  </script>
</body>
</html>
