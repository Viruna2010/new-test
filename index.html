<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIRU Radio - Live Broadcast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: #000;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 1. Full-Screen Video (No side cropping, slight top offset hides YouTube title) */
    .video-viewport {
      position: absolute;
      top: -35px; /* Pushes top title bar slightly outside the screen */
      left: 0;
      width: 100vw;
      height: calc(100vh + 35px);
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .video-viewport iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 2. Top Right: Solid TV Channel Logo */
    .tv-logo-bug {
      position: absolute;
      top: 25px;
      right: 30px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.65);
      padding: 6px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
    }

    .tv-logo-name {
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    .tv-live-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #dc2626;
      color: #fff;
      font-size: 10.5px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
    }

    .live-pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffffff;
      animation: livePulse 1s infinite alternate;
    }

    @keyframes livePulse {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.3; transform: scale(0.8); }
    }

    /* 3. Bottom Right: Plain White TV Clock (No black box, just pure text) */
    .tv-clock-time {
      position: absolute;
      bottom: 44px;
      right: 25px;
      z-index: 10;
      font-family: 'Orbitron', monospace;
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1.5px;
      /* Shadow ensures visibility over any bright video background */
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.95), 0 0 10px rgba(0, 0, 0, 0.8);
    }

    /* 4. Bottom Broadcast Bar with Beautiful ON AIR Badge */
    .ticker-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 36px;
      background: rgba(6, 10, 20, 0.95);
      z-index: 10;
      display: flex;
      align-items: center;
      border-top: 2px solid #dc2626;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.9);
    }

    .on-air-badge {
      background: #dc2626;
      color: #ffffff;
      font-size: 11px;
      font-weight: 900;
      padding: 0 16px;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 1.5px;
      flex-shrink: 0;
      box-shadow: 4px 0 12px rgba(220, 38, 38, 0.4);
      z-index: 2;
    }

    .on-air-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      animation: livePulse 1s infinite alternate;
    }

    .ticker-viewport {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }

    .ticker-content {
      display: inline-block;
      padding-left: 100%;
      animation: tickerScroll 36s linear infinite;
      font-size: 12.5px;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: 0.8px;
    }

    @keyframes tickerScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    .ticker-item {
      display: inline-block;
      margin-right: 45px;
    }

    .highlight-red { color: #f87171; font-weight: 700; }
    .highlight-blue { color: #38bdf8; font-weight: 700; }
    .highlight-brand { color: #a855f7; font-weight: 800; }
  </style>
</head>
<body onclick="unmuteFallback()">

  <!-- 1. Full-Screen Video (No side cropping) -->
  <div class="video-viewport">
    <iframe 
      id="yt-video"
      src="https://www.youtube.com/embed/egoeUY0PocE?autoplay=1&mute=0&loop=1&playlist=egoeUY0PocE&enablejsapi=1&controls=0&modestbranding=1&rel=0&iv_load_policy=3"
      allow="autoplay; encrypted-media">
    </iframe>
  </div>

  <!-- 2. Top Right: TV Logo Bug -->
  <div class="tv-logo-bug">
    <div class="tv-logo-name">VIRU Radio</div>
    <div class="tv-live-badge">
      <div class="live-pulse-dot"></div>
      LIVE
    </div>
  </div>

  <!-- 3. Bottom Right: Plain White TV Clock (Zero Boxes, Clean Text) -->
  <div class="tv-clock-time" id="clock">00:00:00 PM</div>

  <!-- 4. Bottom Broadcast Bar -->
  <div class="ticker-container">
    <div class="on-air-badge">
      <div class="on-air-dot"></div>
      ON AIR
    </div>
    <div class="ticker-viewport">
      <div class="ticker-content">
        <span class="ticker-item">★ WELCOME TO <span class="highlight-blue">VIRU RADIO LIVE</span> 24/7 BROADCAST</span>
        <span class="ticker-item">★ <span class="highlight-red">STAY WITH US</span> — THIS IS CURRENTLY A LIVE TEST STREAM</span>
        <span class="ticker-item">★ STREAMING HIGH FIDELITY NON-STOP MUSIC & VISUALS</span>
        <span class="ticker-item">★ <span class="highlight-brand">POWERED BY VIRU BEATZ</span> — ALL RIGHTS RESERVED</span>
        <span class="ticker-item">★ ENJOY THE RHYTHM & THANK YOU FOR WATCHING!</span>
      </div>
    </div>
  </div>

  <script>
    // Exact Sri Lanka Time (SLST Asia/Colombo)
    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-US', {
        timeZone: 'Asia/Colombo',
        hour12: true,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      document.getElementById('clock').innerText = timeStr;
    }

    setInterval(updateClock, 250);
    updateClock();

    // Fallback unmute
    function unmuteFallback() {
      const iframe = document.getElementById('yt-video');
      if (iframe && iframe.contentWindow) {
        iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
        iframe.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
      }
    }
  </script>
</body>
</html>
