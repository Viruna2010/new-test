<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIRU Radio - Live Broadcast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Montserrat:wght@700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 1. Full-Screen 16:9 Video */
    .video-viewport {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 100vh;
      transform: translate(-50%, -50%);
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    #yt-player {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw;
      min-height: 100vh;
      min-width: 177.78vh;
      transform: translate(-50%, -50%) scale(1.08);
      border: none;
    }

    /* 2. Top Right TV Bug */
    .tv-channel-bug {
      position: absolute;
      top: 25px;
      right: 35px;
      z-index: 20;
      display: flex;
      align-items: center;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.88) 0%, rgba(30, 41, 59, 0.8) 100%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
    }

    .brand-section {
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Montserrat', sans-serif;
    }

    .brand-viru {
      font-weight: 900;
      font-size: 21px;
      letter-spacing: 2px;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }

    .brand-radio {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 1px;
      color: #ffffff;
    }

    .live-section {
      background: #e11d48;
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 900;
      letter-spacing: 1.5px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffffff;
      animation: liveGlow 1s infinite alternate ease-in-out;
    }

    @keyframes liveGlow {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.35; transform: scale(0.8); }
    }

    /* 3. Bottom Right TV Clock */
    .tv-clock {
      position: absolute;
      bottom: 44px;
      right: 25px;
      z-index: 20;
      font-family: 'Orbitron', monospace;
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1.5px;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.95), 0 0 15px rgba(0, 0, 0, 0.9);
    }

    /* 4. Bottom Broadcast Bar */
    .ticker-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 36px;
      background: rgba(8, 12, 22, 0.95);
      z-index: 20;
      display: flex;
      align-items: center;
      border-top: 2px solid #e11d48;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.9);
    }

    .on-air-badge {
      background: #e11d48;
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 900;
      padding: 0 18px;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 1.5px;
      flex-shrink: 0;
      z-index: 2;
    }

    .ticker-viewport {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }

    .ticker-content {
      display: inline-block;
      padding-left: 100%;
      animation: tickerScroll 36s linear infinite;
      font-size: 12.5px;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: 0.8px;
    }

    @keyframes tickerScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    .ticker-item { display: inline-block; margin-right: 45px; }
    .highlight-red { color: #fb7185; font-weight: 700; }
    .highlight-blue { color: #38bdf8; font-weight: 700; }
    .highlight-brand { color: #c084fc; font-weight: 800; }
  </style>
</head>
<body onclick="unmuteFallback()">

  <div class="video-viewport">
    <div id="yt-player"></div>
  </div>

  <div class="tv-channel-bug">
    <div class="brand-section">
      <span class="brand-viru">VIRU</span>
      <span class="brand-radio">RADIO</span>
    </div>
    <div class="live-section">
      <span class="live-dot"></span>
      LIVE
    </div>
  </div>

  <div class="tv-clock" id="clock">00:00:00 PM</div>

  <div class="ticker-container">
    <div class="on-air-badge">
      <span class="live-dot"></span>
      ON AIR
    </div>
    <div class="ticker-viewport">
      <div class="ticker-content">
        <span class="ticker-item">★ WELCOME TO <span class="highlight-blue">VIRU RADIO LIVE</span> 24/7 BROADCAST</span>
        <span class="ticker-item">★ NOW PLAYING: <span class="highlight-brand" id="now-playing-title">VIRU BEATZ</span></span>
        <span class="ticker-item">★ <span class="highlight-red">STAY WITH US</span> — 24/7 LIVE STREAMING</span>
        <span class="ticker-item">★ <span class="highlight-brand">POWERED BY VIRU BEATZ</span> — ALL RIGHTS RESERVED</span>
      </div>
    </div>
  </div>

  <script>
    // 1. Clock Logic
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', {
        timeZone: 'Asia/Colombo',
        hour12: true,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
    }
    setInterval(updateClock, 250);
    updateClock();

    // 2. Playlist Engine
    let playlist = [{ id: 'egoeUY0PocE', title: 'Meedumen Wasi', artist: 'VIRU Beatz' }];
    let currentIndex = 0;
    let player = null;

    async function fetchPlaylist() {
      try {
        const res = await fetch('/playlist.json?t=' + Date.now());
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          playlist = data;
        }
      } catch (e) {
        console.log("Using default playlist");
      }
    }

    // 3. YouTube IFrame API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    window.onYouTubeIframeAPIReady = async function() {
      await fetchPlaylist();
      createPlayer(playlist[0].id);
    };

    function createPlayer(videoId) {
      updateNowPlayingUI();
      player = new YT.Player('yt-player', {
        videoId: videoId,
        playerVars: {
          'autoplay': 1,
          'controls': 0,
          'enablejsapi': 1,
          'modestbranding': 1,
          'rel': 0,
          'playsinline': 1
        },
        events: {
          'onReady': (e) => e.target.playVideo(),
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      // When current song finishes, play NEXT song automatically!
      if (event.data === YT.PlayerState.ENDED) {
        playNextSong();
      }
    }

    async function playNextSong() {
      await fetchPlaylist(); // Check if admin added any new songs
      currentIndex = (currentIndex + 1) % playlist.length;
      const nextSong = playlist[currentIndex];
      updateNowPlayingUI();

      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById(nextSong.id);
      }
    }

    function updateNowPlayingUI() {
      const current = playlist[currentIndex];
      if (current) {
        document.getElementById('now-playing-title').innerText = `${current.title} (${current.artist})`;
      }
    }

    function unmuteFallback() {
      if (player && typeof player.unMute === 'function') {
        player.playVideo();
        player.unMute();
      }
    }
  </script>
</body>
</html>
